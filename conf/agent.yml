# Trove 全局配置（搜索顺序: ./conf/agent.yml → ~/.trove/conf/agent.yml）
agent:
  # DeepSeek 的 OpenAI 兼容 API，litellm 原生支持
  target: deepseek/deepseek-reasoner
  # 想用推理模型可以改成:
  # target: deepseek/deepseek-reasoner
  # 交互语言: en(默认) / zh — 整个交互过程(提示词、答案、轨迹)统一使用该语言,
  # 不按问题的中英文自动检测
  language: en
  # 时间解析:确定性规则解析相对时间表达(zh/en),未命中静默透传
  date_parser: true
  # 负载削减:
  #   fast_path: 确定性模板快径(单表/单聚合模板命中即直接产出 SQL,
  #              跳过 planner + 生成 + 裁决)。默认开。
  #   reflect_skip: validate 确定性规则全过时跳过 reflect 的 LLM 裁决——
  #                 simple(仅低复杂度题,默认)/ all(所有题)/ off(关闭)
  # fast_path: true
  # reflect_skip: simple
  # OSSIE 语义层目录(相对项目根,按 datasource 名取子目录 .trove/semantic/<datasource>/):
  # 实时渲染 metric 定义 + AI Context 进 schema_context,并作为 term 源参与检索。
  # 空 = 关闭。
  # semantic_layer_path: .trove/semantic
  # Langfuse 可观测性（凭证在 .env: LANGFUSE_PUBLIC_KEY / SECRET_KEY / HOST）
  observability:
    tracing:
      enabled: true
