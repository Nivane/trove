# Trove 全局配置（搜索顺序: ./conf/agent.yml → ~/.trove/conf/agent.yml）
agent:
  # DeepSeek 的 OpenAI 兼容 API，litellm 原生支持
  target: deepseek/deepseek-reasoner
  # 快速档模型: simple/standard 复杂度查询的生成/裁决/语义/洞察走此模型
  # (复杂度分级 grade_complexity 驱动;complex 仍走 target)。留空 = 不分档。
  model_fast: deepseek/deepseek-chat
  # 每节点模型覆盖(按节点名,优先于复杂度分档选模):query_sketch/gen_sql/reflect/
  # insights/conclusion/semantics/refuse/analyze_error。典型配置:query_sketch 用
  # 便宜模型、reflect 用强模型。空 = 不覆盖。
  # node_models:
  #   query_sketch: deepseek/deepseek-chat
  #   reflect: deepseek/deepseek-reasoner
  # EXPLAIN 行数估算守卫(默认关):每次最终执行前 EXPLAIN 估算最重算子行数,
  # 超 explain_max_rows 打回 gen_sql 加 LIMIT/收窄。fail-open(方言不可解析/
  # EXPLAIN 失败 → 放行)。防分析 agent 误跑超大扫描/笛卡尔积。
  # explain_row_guard: true
  # explain_max_rows: 50000000
  # 交互语言: zh(默认) / en — 整个交互过程(提示词、答案、轨迹)统一使用该语言,
  # 不按问题的中英文自动检测
  language: zh
  # 时间解析:确定性规则解析相对时间表达(zh/en),未命中静默透传
  date_parser: true
  # 生成 SQL 后 LLM 说明语义(输出与 HITL 确认时展示)
  explain_semantics: true
  # 执行前人工确认(LangGraph interrupt,需 persistence/checkpointer;
  # REPL/CLI/serve 均已接 resume)。当前默认关:每次自动执行,不再打断。
  hitl: false
  # 执行后 LLM 基于结果生成洞察
  insights: true
  # 执行后 LLM 用一句话生成结论摘要,置于回答开头(结论前置)
  conclusion: true
  # 图表 LLM 判定:让 LLM 决定是否画图 + 图表类型 + 维度/度量列(单次
  # plot_chart 工具调用,失败回退确定性推断)。false = 纯启发式(infer_chart)。
  chart_llm: true
  # 精确问题结果缓存(进程内存):归一化后完全相同的问句直接返回上次验证通过的
  # SQL+结果,0 LLM 调用。命中时跳过 HITL 确认——该 SQL 首次运行已人工确认过。
  # 数据新鲜度由 TTL(300s)+ datasource 隔离保证。false = 关闭。
  result_cache: true
  # 多任务拆解 LLM 判断层:规则正则未命中但"疑似多步"(长问句/弱提示词)时,
  # 花一次 fast 调用判断是否拆解。false = 纯正则门控(单问题零 LLM,但
  # "各行业贷款TOP3的银行及其坏账率"这类隐式多步不会被识别)。
  decompose_llm_judge: true
  # 负载削减:
  #   fast_path: 确定性模板快径(单表/单聚合模板命中即直接产出 SQL,
  #              跳过 query_sketch + 生成 + 裁决)。默认开。
  #   reflect_skip: validate 确定性规则全过时跳过 reflect 的 LLM 裁决——
  #                 simple(仅低复杂度题,默认)/ standard(再跳 standard,
  #                 修正轮强制 standard 复杂度,成功轮也受益)/ all/ off
  # fast_path: true
  reflect_skip: standard
  # 上下文预算覆盖(按复杂度分档 simple/standard/complex 的 token 上限;
  # 空 = 用内置默认 1500/2500/4000 与 schema 900/1800/3500)。
  # 200k/1m 窗口下可按模型窗口比例放大——只放大可选块预算并不能自动把
  # 大窗口用起来(历史/多轮/schema 全量才是大窗口的主战场),请谨慎。
  # context_budget_tokens: {simple: 1500, standard: 2500, complex: 8000}
  # schema_budget_tokens: {simple: 900, standard: 1800, complex: 6000}
  # OSSIE 语义层目录(相对项目根,按 datasource 名取子目录 .trove/semantic/<datasource>/):
  # 实时渲染 metric 定义 + AI Context 进 schema_context,并作为 term 源参与检索。
  # 仅作补充源——唯一真源 = 数据源的 KB semantics.yml(/kb init 生成 + 人审)。
  # 空 = 关闭。
  # semantic_layer_path: .trove/semantic
  # 语义优先(Phase B):语义模型是生成主视角与可答边界——gen_sql/query_sketch 以
  # 语义视角为主,未覆盖查询拒绝 + 反问扩展模型(LLM 草拟 draft → 管理端确认
  # → 重答),无语义模型的数据源拒绝并提示先 /kb init。catalog 枚举工具
  # (search_values / lookup_schema / explain_plan) 始终注册,agent 可触达物理
  # schema 作值确认 / 结构懒加载 / 执行计划辅助(不替代语义边界判定)。
  semantic_first: true
  # Langfuse 可观测性（凭证在 .env: LANGFUSE_PUBLIC_KEY / SECRET_KEY / HOST）
  observability:
    tracing:
      enabled: true
  # 会话保留策略(配额清理):每用户会话数超限时删最旧。
  # 0 = 关闭对应机制;periodic 需 schedule daemon 或 serve 长驻才生效。
  # serve 与 daemon 建议单实例运行(双进程并发 sweep 由 SQLite 锁+幂等兜底,最坏多删一次)。
  retention:
    max_sessions_per_user: 100
    active_grace_min: 10
    max_checkpoints_per_thread: 50
    sweep_interval_hours: 24
  # ── 统一内部存储(StorageBackend 抽象)──
  # Trove 自身状态(会话/任务/用户事实/记忆/认证/设置/作业/血缘/检索日志/
  # checkpointer)默认走 SQLite(内存/本地);生产 PostgreSQL 通过环境变量
  # TROVE_STORAGE_URL=postgresql://... 启用(所有内部 store + AsyncPostgresSaver
  # 落同一实例)。业务数据源适配器不在此抽象内——用户自己的数据库照常连接。
  # storage:
  #   url: postgresql://user:pass@host:5432/trove   # 或环境变量 TROVE_STORAGE_URL
  # ── 统一记忆子系统(记忆深度版)──
  # 情景记忆(episodic):跨会话过去查询(question→SQL→verdict→修正要点)自动
  # 入库,gen_sql 检索并注入(成功 SQL 是最强 few-shot 锚,失败+修正防重犯)。
  # 观测回流:成功查询自动草拟 pending 参考示例;修正/失败沉淀 pending 教训
  # (都需 admin 确认才进检索——自动内容永不污染人工 KB)。
  # 偏好自动提取:会话压缩时 LLM 抽取用户口径/偏好,高置信直入 user_facts,
  # 低置信落 pending 草稿(管理端确认)。
  # 自动晋升(promotion: false 默认关):教训置信度过阈值(多轮复用/好评)自动确认。
  # 画像(profile_boost: false 默认关):每用户每源正确率/失败模式,可选注入。
  # 生命周期:agent.yml 的 memory.retention_days 控制各层过期清理(serve 周期
  # sweep 自动跑);schema_drift_check 对比 live schema 与 KB schema_notes。
  memory:
    enabled: true
    episodes: true
    auto_examples: true
    auto_preferences: true
    promotion: false
    promotion_threshold: 0.8
    profile_boost: false
    schema_drift_check: true
    # retention_days: 各层过期天数(None/缺省 = 不清理)
    #   episodes: 180
    #   preferences: 90
    #   facts: 180
    #   retrieval_log: 90
