- question: 每年发放的贷款笔数
  note: "## Answer\n\n**Question**: 每年发放的贷款笔数\n\n### Generated SQL\n\n```sql\nSELECT\n\
    \  SUBSTRING(date, 1, 2) AS year,\n  COUNT(*) AS loan_count\nFROM loan\nGROUP\
    \ BY\n  SUBSTRING(date, 1, 2)\n```\n\n### Semantics\n\n这个查询统计的是每年发放的贷款笔数。它从贷款记录表中提取每笔贷款的发放年份，然后按年份分组，计算每个年份的贷款总笔数。结果会显示两列：一列是年份（如“21”代表2021年），另一列是该年发放的贷款数量。这样你就能直观地看到各年贷款业务量的变化趋势。\n\
    \n### Results (2 rows)\n\n| year | loan_count |\n| --- | --- |\n| 96 | 2 |\n|\
    \ 97 | 1 |\n\n**Chart**: 每年发放的贷款笔数\n```\n96  ████████████████████████ 2\n97  ████████████\
    \ 1\n```\n\n\n---\n*Execution time: 0ms*\n\n### Insights\n\n- 1996年发放了2笔贷款，1997年发放了1笔贷款，两年合计仅3笔。\n\
    - 贷款发放量从1996年到1997年下降了50%，减少1笔。\n- 数据仅覆盖两年，且每年笔数极少，无法反映显著趋势，需更多年份数据支撑决策。"
  sql_snippet: 'SELECT substr(date, 1, 2) AS year, COUNT(*) AS loan_count

    FROM loan

    GROUP BY substr(date, 1, 2)'
