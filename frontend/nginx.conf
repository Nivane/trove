# Frontend container: serves the built SPA at / and reverse-proxies
# /v1/* to the backend container (docker-compose service name `backend`).
# Same-origin proxying keeps the app free of CORS; chat streams typed
# events over SSE, so buffering must stay off for /v1.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── SPA (vite base = /) ──────────────────────────────────────────
    location / {
        # history-mode router: deep links like /admin/users must
        # fall back to index.html instead of 404
        try_files $uri $uri/ /index.html;

        # hashed assets are immutable → long cache
        location ~* \.(?:js|css|png|jpe?g|gif|svg|ico|woff2?|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
        # index.html must never be cached — it points at fresh hashes
        location = /index.html {
            add_header Cache-Control "no-cache";
        }
    }

    # ── API + SSE: proxy to the backend container ─────────────────
    location /v1/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE: buffering would delay the event stream; read timeout
        # must exceed a long agent turn (per-tool timeouts + retries)
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
