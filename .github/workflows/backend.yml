name: backend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # 常驻 Postgres(pgvector 镜像,vector 扩展):CI 测试的数据库底座。
      # 内部状态存储走统一 Storage 抽象——生产 PostgreSQL / 测试内存 SQLite。
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: trove
          POSTGRES_PASSWORD: trove
          POSTGRES_DB: trove
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trove -d trove"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies (with postgres extra)
        run: uv sync --extra postgres

      # 零网络主套件:内部 store 走内存 SQLite 兜底(不设 TROVE_STORAGE_URL)。
      - name: Run unit tests (SQLite fallback, zero network)
        run: uv run pytest -m "not integration" -q

      # 真实 Postgres 集成:统一存储抽象 + pg_hybrid 检索在 PG 上验证。
      - name: Run Postgres integration tests
        env:
          PG_TEST_URL: postgresql://trove:trove@127.0.0.1:5432/trove
          TROVE_STORAGE_URL: postgresql://trove:trove@127.0.0.1:5432/trove
        run: |
          uv run pytest -m integration -q \
            tests/services/retrieval/test_pg_store.py
          # 统一存储抽象在 PG 上的内部 store 端到端(见 tests/storage/test_pg_storage.py)
          uv run pytest -m integration -q tests/storage/test_pg_storage.py
          # 版本化迁移的 PG 方言路径(ADD COLUMN IF NOT EXISTS / 失败一步后的
          # aborted 事务收拾)—— 只在真 PG 上才露头,SQLite 侧测不到。
          uv run pytest -m integration -q tests/storage/test_migrations_pg.py
          # PG 适配器的真实连接生命周期(建库/建表/内省)。
          uv run pytest -m integration -q tests/services/test_postgres_adapter.py

  lint:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 是这条门的前提,不是图省事:
      # 每页的比对基准写在 HTML 里(anchor-base: <sha>),脚本要读**那个提交**的
      # 原文才能判断锚点漂没漂。浅克隆里那些提交不存在 → 全站误报「失效」。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --extra postgres
      - name: Import smoke
        run: uv run python -c "import trove.main; print('import ok')"
      # 静态质量门禁:pyflakes 未用/未定义名 + pycodestyle 错误级
      # (配置见 pyproject.toml [tool.ruff];E501 行长不拦)。
      - name: Ruff lint gate
        run: uv run ruff check trove tests
      # 文档站锚点门:docs/ 里每条 file:line 链接都锚到源码的具体行,代码一移动
      # 就漂 —— 而漂掉的链接比没有链接更糟,读者点过去看到的是**别的**代码。
      #
      # 为什么挂在这:脚本自带的 pre-commit 钩子按设计只**提醒**不阻断(怕挡住
      # 别人的正常提交)。提醒属于「得记得跑」型的约束,而记得跑的约束都是死的:
      # 它就是这样在无人察觉下攒到 97 处漂移,直到一次全站归位。CI 是默认路径,
      # 不需要谁记得。零 LLM / 零网络 / 零数据库,没有成本需要防。
      #
      # 比对 HEAD 而不是默认的 main:PR 上 checkout 出来的是合并后的状态(也就是
      # 未来的 main),而锚点要成立在那个版本上。本地 main 落后时拿 main 比对,
      # 会把「按新代码写的行号」误判成漂移。
      - name: Docs anchor gate
        run: uv run python scripts/check_page_anchors.py --at HEAD
      # 漂移门:KB 的语义模型(semantics.yml)与数据源的真实目录是否还对得上。
      # 「模型与真实数据已经对不上」是慢性的,发现它不能靠人想起去巡检。
      #
      # 为什么挂在这:和上一条锚点门同一个理由 —— 零 LLM / 零网络。它不连任何
      # 远端:demo 数据源是内置的,脚本会就地建一份 BIRD 金融 SQLite
      # (`~/.trove/demo.db`);KB 是签进仓库的 .trove/kb/demo/*.yml。所以它
      # 没有成本需要防,该走默认路径,而不是留在「得记得手动跑」那一档。
      #
      # 也别被 `--datasource demo` 骗到以为要先注册:注册表
      # (`.trove/datasources.yml`)是 gitignore 的,CI 上**不存在**,而脚本
      # 对内置 demo 有兜底,不需要它(scripts/check_drift.py 的 DEMO_NAME 分支)。
      #
      # 退出码 0/1/2 是三态,不是两态:0 没漂移、1 有漂移、2 **没查成**。
      # 脚本刻意不让「没查成」混进 0 —— 一份只跑了 L1 的 ok 报告不许被读成全绿。
      #
      # 守的边界要说清:它守的是**仓库里这份 demo KB**(demo 的库表改了而 KB
      # 没跟上,这条就红),不是用户的库 —— 用户侧靠后台周期检测,那条已落进
      # 漂移库,与 /v1/admin/drift 读写同一份文件。
      - name: Drift gate
        run: uv run python scripts/check_drift.py --datasource demo --kb-dir .trove/kb
      # 依赖漏洞扫描(OSV):导出锁定依赖清单交给 pip-audit 比对公开漏洞库。
      - name: Dependency vulnerability scan
        run: |
          uv export --no-hashes -o /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt
