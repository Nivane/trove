name: frontend

on:
  push:
    paths:
      - 'frontend/**'
      - 'Dockerfile'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'Dockerfile'
      - '.github/workflows/frontend.yml'

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # jsdom 30 (via vitest) requires Node >= 22.22 — undici 8 needs
          # worker_threads.markAsUncloneable (Node 20/early-22 crash workers)
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run ci

  # Keep the multi-stage Dockerfile honest: builds it on every frontend change.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t trove:ci .
