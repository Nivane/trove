# Skill manifest: node-triggered methodology blocks.
# Each skill declares deterministic trigger conditions; a skill matches when
# every trigger field matches the node context (scalar equality, or list
# membership for OR semantics). Matched skills are rendered into the node's
# system prompt via render_skills().

- name: plan_query
  description: >
    Planner decomposition methodology: decision order, traceability
    self-check, and common failure modes. Supplements the base
    planner/system template (which carries JSON format, scoping and
    answer-columns rules).
  triggers:
    node: planner

- name: diagnose_failure
  description: >
    Error-diagnosis methodology for correction rounds: how to read the
    failure class, how to act on the deterministic regression feedback,
    and how to pick the true root layer as rollback target. Supplements
    the base analyze_error/system template (which defines the output
    contract and the target mapping).
  triggers:
    node: analyze_error

- name: align_schema
  description: >
    Schema-alignment methodology for the schema_linking node's LLM call:
    decide table/column necessity by question coverage, prefer populated
    columns over name-matching empty ones, metric tables over entity-only
    tables, and join-path awareness. Supplements the base
    schema_alignment/system template (which defines the JSON contract).
  triggers:
    node: schema_linking
