# Skill manifest: node-triggered methodology blocks.
# Matched skills are rendered into the node's system prompt via render_skills().
#
# 触发语义见 prompts/skills/match_trigger —— 唯一的实现:
#   - 标量相等,或列表包含(OR)
#   - role:列表对列表,**有交集即命中**;值缺失(None/[])一律不命中
#   - node 始终必须相等

- name: plan_query
  description: >
    Query-sketch decomposition methodology: decision order, traceability
    self-check, and common failure modes. Supplements the base
    query_sketch/system template (which carries JSON format, scoping and
    answer-columns rules).
  triggers:
    node: query_sketch

- name: diagnose_failure
  description: >
    Error-diagnosis methodology for correction rounds: how to read the
    failure class, how to act on the deterministic regression feedback,
    and how to pick the true root layer as rollback target. Supplements
    the base analyze_error/system template (which defines the output
    contract and the target mapping).
  triggers:
    node: analyze_error

- name: sql_construction
  description: >
    Answer-construction discipline for the SQL generator: share/ratio
    shapes (numerator inside the aggregation, denominator = the filtered
    population, *100 outermost), extreme-selection ordering keys kept out
    of the projection, name-column (not id-column) dimension filters, and
    row filters in conditions with having reserved for post-aggregation
    filters. Cross-datasource construction methodology.
  triggers:
    node: gen_sql
