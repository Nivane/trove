semantic_model:
- name: financial
  datasets:
  - name: account
    source: financial.account
    primary_key:
    - account_id
    fields:
    - name: account_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: account_id
      datatype: Integer
      semantic_role: identifier
      ai_context:
        synonyms:
        - account number
      description: the id of the account
    - name: district_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: district_id
      datatype: Integer
      semantic_role: identifier
      ai_context:
        synonyms:
        - branch district
      description: location of branch
    - name: frequency
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: frequency
      datatype: String
      semantic_role: enum
      enum_display:
        POPLATEK MESICNE: monthly issuance
        POPLATEK TYDNE: weekly issuance
        POPLATEK PO OBRATU: issuance after transaction
      ai_context:
        synonyms:
        - statement frequency
        - transaction frequency
      description: frequency of the acount
    - name: date
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: date
      datatype: Date
      semantic_role: time
      ai_context:
        synonyms:
        - creation date
        - account opening date
      description: the creation date of the account
  - name: card
    source: financial.card
    primary_key:
    - card_id
    fields:
    - name: card_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: card_id
      datatype: Integer
      semantic_role: identifier
      ai_context:
        synonyms:
        - card number
      description: id number of credit card
    - name: disp_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: disp_id
      datatype: Integer
      semantic_role: identifier
      ai_context:
        synonyms:
        - disposition id
      description: disposition id
    - name: type
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: type
      datatype: String
      semantic_role: enum
      enum_display:
        gold: high-level credit card
        classic: standard class of credit card
        junior: junior class of credit card
      ai_context:
        synonyms:
        - card category
        - card tier
      description: type of credit card
    - name: issued
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: issued
      datatype: Date
      semantic_role: time
      ai_context:
        synonyms:
        - issue date
        - card issue date
      description: the date when the credit card issued
  - name: client
    source: financial.client
    primary_key:
    - client_id
    fields:
    - name: client_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: client_id
      datatype: Integer
      semantic_role: identifier
      ai_context:
        synonyms:
        - customer id
      description: the unique number
    - name: gender
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: gender
      datatype: String
      semantic_role: enum
      enum_display:
        F: female
        M: male
      ai_context:
        synonyms:
        - sex
      description: gender of the client
    - name: birth_date
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: birth_date
      datatype: Date
      semantic_role: time
      ai_context:
        synonyms:
        - date of birth
        - dob
      description: birth date
    - name: district_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: district_id
      datatype: Integer
      semantic_role: identifier
      ai_context:
        synonyms:
        - residence district
      description: location of branch
  - name: disp
    source: financial.disp
    primary_key:
    - disp_id
