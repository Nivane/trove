          expression: balance
      datatype: Integer
      semantic_role: measure
      ai_context:
        synonyms:
        - account balance
      description: balance after transaction
    - name: k_symbol
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: k_symbol
      datatype: String
      semantic_role: enum
      enum_display:
        SIPO: household
        SLUZBY: payment for statement
        UVER: loan payment
        POJISTNE: insurrance payment
        DUCHOD: old-age pension
        UROK: interest credited
        SANKC. UROK: sanction interest if negative balance
      ai_context:
        synonyms:
        - transaction purpose
        - transaction category
      description: purpose or category of the transaction
    - name: bank
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: bank
      datatype: String
      semantic_role: enum
      enum_display:
        AB: bank AB
        YZ: bank YZ
        ST: bank ST
        QR: bank QR
        WX: bank WX
        CD: bank CD
        UV: bank UV
        KL: bank KL
        GH: bank GH
        OP: bank OP
        IJ: bank IJ
        EF: bank EF
        MN: bank MN
      ai_context:
        synonyms:
        - counterparty bank
      description: bank code of the counterparty
    - name: account
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: account
      datatype: Integer
      semantic_role: measure
      ai_context:
        synonyms:
        - counterparty account
      description: account number of the counterparty
  relationships:
  - name: account_to_district
    from: account
    to: district
    from_columns:
    - district_id
    to_columns:
    - district_id
    cardinality: 1:N
  - name: card_to_disp
    from: card
    to: disp
    from_columns:
    - disp_id
    to_columns:
    - disp_id
    cardinality: 1:N
  - name: client_to_district
    from: client
    to: district
    from_columns:
    - district_id
    to_columns:
    - district_id
    cardinality: 1:N
  - name: disp_to_client
    from: disp
    to: client
    from_columns:
    - client_id
    to_columns:
    - client_id
    cardinality: 1:N
  - name: disp_to_account
    from: disp
    to: account
    from_columns:
    - account_id
    to_columns:
    - account_id
    cardinality: 1:N
  - name: loan_to_account
    from: loan
    to: account
    from_columns:
    - account_id
    to_columns:
    - account_id
    cardinality: 1:N
  - name: order_to_account
    from: order
    to: account
    from_columns:
    - account_id
    to_columns:
    - account_id
    cardinality: 1:N
  - name: trans_to_account
    from: trans
    to: account
    from_columns:
    - account_id
    to_columns:
    - account_id
    cardinality: 1:N
  metrics:
  - name: number of account records
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(account.account_id)
    description: total number of records in the account table
    ai_context:
      synonyms:
      - account count
  - name: average year of Date the account was created
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: AVG(EXTRACT(YEAR FROM account.date))
    description: average year of Date the account was created
    ai_context:
      synonyms:
      - Date the account was created average year
  - name: share of account records where Frequency of account statements or transactions,
      stored as all-caps codes is monthly issuance
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: CAST(SUM(CASE WHEN account.frequency = 'POPLATEK MESICNE' THEN
          1 ELSE 0 END) AS DOUBLE) * 100.0 / COUNT(*)
    description: percentage of account records where Frequency of account statements
      or transactions, stored as all-caps codes is monthly issuance
    ai_context:
      synonyms:
      - percentage of account records where Frequency of account statements or transactions,
        stored as all-caps codes is monthly issuance
      - monthly issuance account record share
  - name: share of account records where Frequency of account statements or transactions,
      stored as all-caps codes is weekly issuance
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: CAST(SUM(CASE WHEN account.frequency = 'POPLATEK TYDNE' THEN 1
          ELSE 0 END) AS DOUBLE) * 100.0 / COUNT(*)
    description: percentage of account records where Frequency of account statements
      or transactions, stored as all-caps codes is weekly issuance
    ai_context:
      synonyms:
      - percentage of account records where Frequency of account statements or transactions,
        stored as all-caps codes is weekly issuance
      - weekly issuance account record share
  - name: share of account records where Frequency of account statements or transactions,
      stored as all-caps codes is issuance after each transaction
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: CAST(SUM(CASE WHEN account.frequency = 'POPLATEK PO OBRATU' THEN
          1 ELSE 0 END) AS DOUBLE) * 100.0 / COUNT(*)
