  - name: loan
    source: financial.loan
    primary_key:
    - loan_id
    fields:
    - name: loan_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: loan_id
      datatype: Integer
      semantic_role: identifier
      ai_context:
        synonyms:
        - loan identifier
      description: the id number identifying the loan data
    - name: account_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: account_id
      datatype: Integer
      semantic_role: identifier
      ai_context:
        synonyms:
        - account identifier
      description: the id number identifying the account
    - name: date
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: date
      datatype: Date
      semantic_role: time
      ai_context:
        synonyms:
        - loan start date
      description: the date when the loan is approved
    - name: amount
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: amount
      datatype: Integer
      semantic_role: measure
      ai_context:
        synonyms:
        - loan amount
      description: approved amount
    - name: duration
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: duration
      datatype: Integer
      semantic_role: measure
      ai_context:
        synonyms:
        - loan term
      description: loan duration
    - name: payments
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: payments
      datatype: Float
      semantic_role: measure
      ai_context:
        synonyms:
        - monthly payment
      description: monthly payments
    - name: status
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: status
      datatype: String
      semantic_role: enum
      enum_display:
        A: contract finished, no problems
        B: contract finished, loan not paid
        D: running contract, client in debt
        C: running contract, OK so far
      ai_context:
        synonyms:
        - repayment state
        - loan state
      description: repayment status
  - name: order
