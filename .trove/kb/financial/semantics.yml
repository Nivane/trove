      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: trans_id
      datatype: Integer
      semantic_role: identifier
      ai_context:
        synonyms:
        - transaction identifier
      description: transaction id
    - name: account_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: account_id
      datatype: Integer
      semantic_role: identifier
      ai_context:
        synonyms:
        - account identifier
      description: identifier of the account involved in the transaction
    - name: date
      expression:
