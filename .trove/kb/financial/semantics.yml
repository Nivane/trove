    - name: disp_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: disp_id
      datatype: Integer
      semantic_role: identifier
      ai_context:
        synonyms:
        - disposition id
      description: unique number of identifying this row of record
    - name: client_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: client_id
      datatype: Integer
      semantic_role: identifier
      ai_context:
        synonyms:
        - customer id
      description: id number of client
    - name: account_id
