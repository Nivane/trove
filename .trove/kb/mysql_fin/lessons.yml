- question: 1994-1996 每年发放了多少笔贷款?
  note: "### 结论\n\n1994年发放101笔，1995年90笔，1996年117笔。\n\n\n**图表**: 1994-1996 每年发放了多少笔贷款?\n\
    ```\n1994  ████████████████████ 101\n1995  ██████████████████ 90\n1996  ████████████████████████\
    \ 117\n```\n\n<details>\n<summary>结果明细</summary>\n\n### 结果 (3 行)\n\n| year | num_loans\
    \ |\n| --- | --- |\n| 1994 | 101 |\n| 1995 | 90 |\n| 1996 | 117 |\n</details>\n\
    \n### 洞察\n\n- 1994-1996年贷款发放量呈V型波动，1995年降至最低的90笔，较1994年减少11笔。\n- 1996年贷款发放量回升至117笔，为三年最高，较1995年增长30%。\n\
    - 三年间年度贷款发放量在90至117笔之间，整体规模相对稳定。\n\n\n<details>\n<summary>查看 SQL 与详情</summary>\n\
    \n### 生成的 SQL\n\n```sql\nSELECT\n  YEAR(CAST(loan.date AS DATE)) AS year,\n  COUNT(loan.loan_id)\
    \ AS num_loans\nFROM loan\nWHERE\n  loan.date >= '1994-01-01' AND loan.date <=\
    \ '1996-12-31'\nGROUP BY\n  YEAR(CAST(loan.date AS DATE))\nORDER BY\n  year\n\
    ```\n\n### 语义说明\n\n这条查询统计的是 1994 到 1996 这三年里，每年各发放了多少笔贷款。它从贷款表（loan）中取出每笔贷款的日期和编号，"
  sql_snippet: 'SELECT YEAR(loan.date) AS year, COUNT(loan.loan_id) AS num_loans

    FROM loan

    WHERE loan.date >= ''1994-01-01'' AND loan.date <= ''1996-12-31''

    GROUP BY YEAR(loan.date)

    ORDER BY year'
  upvotes: 3
  downvotes: 0
  confirmed: false
  updated_at: '2026-09-12T03:47:48.087708+00:00'
