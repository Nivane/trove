[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trove-agent"
version = "0.1.0"
description = "Trove — Ask your data, answered by a knowledge base that grows"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
authors = [
    {name = "Trove Contributors"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "aiosqlite>=0.20.0",
    "litellm>=1.50.0",
    "sqlglot>=25.0.0",
    "prompt-toolkit>=3.0.0",
    "rich>=13.0.0",
    "tiktoken>=0.7.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langfuse>=4.14.4",
    "langchain>=1.3.15",
    "cryptography>=50.0.0",
    "jinja2>=3.1.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "fastmcp>=3.4.7",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
postgres = [
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary]>=3.2.0",
]
duckdb = ["duckdb>=1.0.0"]
mysql = [
    "aiomysql>=0.3.2",
]
clickhouse = [
    "clickhouse-connect>=1.7.1",
]
# 本地 learned-sparse / cross-encoder(bge-m3 dense+sparse 单模型、bge-reranker
# 精排):拉入 FlagEmbedding(torch),离线、无需 LLM 凭证;不装则退化为
# API embedder + 确定性精排,功能不受影响。
bge = [
    "FlagEmbedding>=1.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
trove = "trove.main:main_repl"
trove-cli = "trove.main:main_cli"

[tool.setuptools.packages.find]
include = ["trove*"]

[tool.setuptools.package-data]
trove = ["prompts/*.j2", "prompts/gen_sql/*.j2", "prompts/query_sketch/*.j2", "prompts/reflect/*.j2",
         "prompts/analyze_error/*.j2", "prompts/answer/*.j2", "prompts/metadata_check/*.j2",
         "prompts/intent/*.j2", "prompts/kb/*.j2", "prompts/lesson_distill/*.j2", "prompts/session/*.j2"]

[tool.uv]
package = true
default-groups = ["dev"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short", "--strict-markers"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests (requires real services)",
]
