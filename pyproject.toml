[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trove-agent"
version = "0.1.0"
description = "Trove — Ask your data, answered by a knowledge base that grows"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
authors = [
    {name = "Trove Contributors"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "aiosqlite>=0.20.0",
    "litellm>=1.50.0",
    "sqlglot>=25.0.0",
    "prompt-toolkit>=3.0.0",
    "rich>=13.0.0",
    "tiktoken>=0.7.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "langfuse>=4.14.4",
    "langchain>=1.3.15",
    "cryptography>=50.0.0",
    "jinja2>=3.1.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    # 3.4.10 是 GHSA-7xgj-8392-5q4r 在 3.x 线的修复版;4.x 另属一条修复线,
    # 但会连带 mcp 1.x → 2.x 的大版本跃迁,本仓尚未评估 —— 先停在 3.x。
    "fastmcp>=3.4.10,<4",
    "prometheus-client>=0.20.0",
    # OIDC SSO:discovery/JWKS/token 走 httpx(测试用 MockTransport,零真实网络);
    # ID token 校验走 PyJWT,算法固定为非对称([crypto] 拉入 cryptography,
    # 本仓已是直接依赖)。
    "httpx>=0.27.0",
    "PyJWT[crypto]>=2.8.0",
]

[project.urls]
Homepage = "https://github.com/Nivane/trove"
Repository = "https://github.com/Nivane/trove"
Documentation = "https://nivane.github.io/trove/"
Issues = "https://github.com/Nivane/trove/issues"
Changelog = "https://github.com/Nivane/trove/blob/main/CHANGELOG.md"

[project.optional-dependencies]
postgres = [
    "langgraph-checkpoint-postgres>=3.1.3",
    "psycopg[binary]>=3.2.0",
]
duckdb = ["duckdb>=1.0.0"]
mysql = [
    "aiomysql>=0.3.2",
]
doris = [
    "aiomysql>=0.3.2",
]
clickhouse = [
    "clickhouse-connect>=1.7.1",
]
# floor 5.1 不是随手写的:终止路径走 5.x 的公开异步查询生命周期
# (``cursor.execute_async`` 拿服务端查询 id → ``cursor.abort_query(qid)``);
# 4.x 是另一套 ``conn._cancel_query(sql, requestId)``,5.x 已删除,两代接口
# 不兼容。升到 5.x 同时是 filelock 安全公告的连带结果:4.x 钉 ``filelock<4``,
# 与 ``filelock>=4.2.1`` 的约束不可共存。
snowflake = [
    "snowflake-connector-python>=5.1",
]
# BigQuery 的客户端同样是**同步**的(无 asyncio 变体)—— 适配器用
# ``asyncio.to_thread`` 包住整个调用。floor 挑近代 3.x:本适配器只走长期
# 稳定的接口(client.query / job.result / job.cancel / 元数据 API),
# floor 是"不给自己找远古版本麻烦",不是某个 API 的硬要求。
bigquery = [
    "google-cloud-bigquery>=3.20",
]
# 本地 dense embedder(bge-m3)与 cross-encoder 精排(bge-reranker):拉入
# FlagEmbedding(torch),离线、无需 LLM 凭证;不装则退化为 API embedder +
# 无精排(默认档),功能不受影响。
bge = [
    "FlagEmbedding>=1.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
]

[project.scripts]
trove = "trove.main:main_repl"
trove-cli = "trove.main:main_cli"

[tool.setuptools.packages.find]
include = ["trove*"]

[tool.setuptools.package-data]
trove = ["prompts/*.j2", "prompts/gen_sql/*.j2", "prompts/query_sketch/*.j2", "prompts/reflect/*.j2",
         "prompts/analyze_error/*.j2", "prompts/answer/*.j2", "prompts/metadata_check/*.j2",
         "prompts/intent/*.j2", "prompts/kb/*.j2", "prompts/lesson_distill/*.j2", "prompts/session/*.j2",
         "presets/*/preset.yml"]

[tool.uv]
package = true
default-groups = ["dev"]
# filelock 是传递依赖(huggingface-hub 拉入),本仓不直接 import —— 用约束
# 而非直接依赖把版本抬到修复线:4.2.1 起修掉三条 Windows 锁文件类公告
# (GHSA-567q-5qvw-pf92 / GHSA-9vhv-jxww-xfm5 / GHSA-v4x8-3wr5-3wq8)。
constraint-dependencies = ["filelock>=4.2.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short", "--strict-markers"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests (requires real services)",
]

# CI 质量门禁:pyflakes 未用变量/导入/未定义名 + pycodestyle 错误级。
# E501(行长)是纯风格噪音不拦;E402 为 3 处**故意**惰性导入模块豁免
# (admin / kb.service / datasource.registry——后者把内置方言的 import 与
# register_adapter 自注册收在同一段,见该文件末尾);
# 测试目录容忍 E741(l 等短循环变量,生产代码保持严格)。
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"trove/api/routers/admin.py" = ["E402"]
"trove/services/kb/service.py" = ["E402"]
"trove/services/datasource/registry.py" = ["E402"]
"tests/**" = ["E402", "E741"]
